<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 88 1060 624" role="img" aria-labelledby="title desc">
  <title id="title">Flexible body dynamics preview</title>
  <desc id="desc">Minimal light-themed illustration of finite deformation kinematics and dynamics.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="mesh" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 0 L28 0 L28 28 L0 28 Z M0 0 L28 28 M28 0 L0 28" fill="none" stroke="#d5dfec" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="70" y="88" width="1060" height="624" rx="26" fill="#ffffff" stroke="#d6e0eb" stroke-width="2"/>
  <rect x="96" y="114" width="1008" height="472" rx="18" fill="url(#mesh)"/>

  <path d="M160 500 C300 470, 420 320, 565 350 C705 378, 785 530, 945 500"
        fill="none" stroke="url(#beam)" stroke-width="24" stroke-linecap="round"/>
  <path d="M160 548 C320 526, 430 452, 575 464 C720 477, 805 560, 945 542"
        fill="none" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="10 10"/>

  <circle cx="160" cy="500" r="13" fill="#0f172a"/>
  <circle cx="945" cy="500" r="13" fill="#0f172a"/>

  <path d="M260 650 L420 615 L580 650 L740 615 L900 650" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="260" cy="650" r="6" fill="#64748b"/>
  <circle cx="420" cy="615" r="6" fill="#64748b"/>
  <circle cx="580" cy="650" r="6" fill="#64748b"/>
  <circle cx="740" cy="615" r="6" fill="#64748b"/>
  <circle cx="900" cy="650" r="6" fill="#64748b"/>

  <line x1="362" y1="270" x2="470" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="292" x2="650" y2="368" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="118" y="170" fill="#0f172a" font-size="34" font-family="Georgia, serif">Kinematics and Dynamics for Flexible Bodies</text>
  <text x="118" y="212" fill="#475569" font-size="22" font-family="Georgia, serif">Large deformation framework - arXiv:2602.17002</text>
</svg>
