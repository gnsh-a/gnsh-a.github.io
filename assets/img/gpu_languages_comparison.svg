<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GPU Languages Comparison</title>
  <desc id="desc">Illustration for a project comparing GPU programming languages across common kernels and performance.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="55%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#23395d"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#14213d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 52px "Segoe UI", Arial, sans-serif; fill: #f8fafc; letter-spacing: 0.4px; }
      .subtitle { font: 400 27px "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .chip { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; rx: 16; }
      .chipText { font: 700 32px "Segoe UI", Arial, sans-serif; fill: #e2e8f0; }
      .node { fill: url(#panelGrad); stroke: #64748b; stroke-width: 1.5; rx: 14; }
      .nodeText { font: 600 24px "Segoe UI", Arial, sans-serif; fill: #e2e8f0; }
      .link { stroke: #60a5fa; stroke-opacity: 0.85; stroke-width: 3; fill: none; }
      .kernel { font: 500 20px "Segoe UI", Arial, sans-serif; fill: #93c5fd; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="750" fill="url(#bgGrad)"/>

  <g opacity="0.13">
    <path d="M0 110 H1200 M0 220 H1200 M0 330 H1200 M0 440 H1200 M0 550 H1200 M0 660 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M120 0 V750 M240 0 V750 M360 0 V750 M480 0 V750 M600 0 V750 M720 0 V750 M840 0 V750 M960 0 V750 M1080 0 V750" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <text x="72" y="92" class="title">GPU Languages Comparison</text>
  <text x="72" y="134" class="subtitle">Common kernels • consistent benchmarking • performance comparison</text>

  <g filter="url(#shadow)">
    <rect x="460" y="300" width="280" height="120" class="chip"/>
    <text x="600" y="372" text-anchor="middle" class="chipText">Benchmark Core</text>
  </g>

  <g>
    <rect x="120" y="250" width="180" height="78" class="node"/>
    <text x="210" y="298" text-anchor="middle" class="nodeText">CUDA</text>

    <rect x="120" y="390" width="180" height="78" class="node"/>
    <text x="210" y="438" text-anchor="middle" class="nodeText">Triton</text>

    <rect x="900" y="250" width="180" height="78" class="node"/>
    <text x="990" y="298" text-anchor="middle" class="nodeText">Taichi</text>

    <rect x="900" y="390" width="180" height="78" class="node"/>
    <text x="990" y="438" text-anchor="middle" class="nodeText">Warp</text>

    <rect x="510" y="500" width="180" height="78" class="node"/>
    <text x="600" y="548" text-anchor="middle" class="nodeText">NumPy</text>
  </g>

  <g>
    <path class="link" d="M300 289 C365 289, 390 315, 460 345"/>
    <path class="link" d="M300 429 C365 429, 390 405, 460 375"/>
    <path class="link" d="M900 289 C835 289, 810 315, 740 345"/>
    <path class="link" d="M900 429 C835 429, 810 405, 740 375"/>
    <path class="link" d="M600 500 C600 462, 600 445, 600 420"/>
  </g>

  <g>
    <text x="72" y="668" class="kernel">Kernels: vector add • reductions • stencil-like operations</text>
    <text x="72" y="704" class="kernel">Metrics: warmup-aware timing • median latency • CPU reference validation</text>
  </g>
</svg>
